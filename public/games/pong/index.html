<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Pong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
      touch-action: none;
      padding: 12px;
    }
    .hud {
      display: flex;
      align-items: center;
      gap: 32px;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    #pong-box {
      position: relative;
      width: 100%;
      max-width: 540px;
      aspect-ratio: 16 / 10;
      background: #050814;
      border: 2px solid #1e293b;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .mode-bar {
      margin-top: 14px;
      display: flex;
      gap: 12px;
    }
    .btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn.active {
      background: #0284c7;
      color: white;
      border-color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="hud">
    <span id="p1-score">0</span>
    <span style="font-size: 16px; color: #475569;">VS</span>
    <span id="p2-score">0</span>
  </div>

  <div id="pong-box">
    <canvas id="pong-canvas" width="540" height="340"></canvas>
  </div>

  <div class="mode-bar">
    <button class="btn active" id="btn-ai" onclick="setMode('ai')">vs AI Bot</button>
    <button class="btn" id="btn-2p" onclick="setMode('2p')">2 Players (W/S & Up/Down)</button>
    <button class="btn" onclick="resetGame()">Reset</button>
  </div>

  <script>
    const canvas = document.getElementById('pong-canvas');
    const ctx = canvas.getContext('2d');
    const p1El = document.getElementById('p1-score');
    const p2El = document.getElementById('p2-score');

    let mode = 'ai'; // 'ai' or '2p'
    let p1 = { y: 130, h: 70, w: 10, vy: 0, score: 0 };
    let p2 = { y: 130, h: 70, w: 10, vy: 0, score: 0 };
    let ball = { x: 270, y: 170, vx: 4, vy: 2, r: 6 };
    let keys = {};

    let audioCtx = null;
    function beep(freq, dur) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.frequency.value = freq;
        g.gain.value = 0.08;
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function setMode(m) {
      mode = m;
      document.getElementById('btn-ai').className = 'btn' + (m === 'ai' ? ' active' : '');
      document.getElementById('btn-2p').className = 'btn' + (m === '2p' ? ' active' : '');
      resetGame();
    }

    function resetGame() {
      p1.score = 0;
      p2.score = 0;
      p1El.textContent = 0;
      p2El.textContent = 0;
      serveBall(1);
    }

    function serveBall(dir = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      const angle = (Math.random() * 0.6 - 0.3) * Math.PI;
      const speed = 4.5;
      ball.vx = dir * Math.cos(angle) * speed;
      ball.vy = Math.sin(angle) * speed;
    }

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    // Mouse / Touch for Player 1
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const scaleY = canvas.height / rect.height;
      p1.y = (e.clientY - rect.top) * scaleY - p1.h / 2;
    });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const scaleY = canvas.height / rect.height;
      p1.y = (e.touches[0].clientY - rect.top) * scaleY - p1.h / 2;
    }, { passive: false });

    function update() {
      // 2P controls
      if (keys['w'] || keys['W']) p1.y -= 6;
      if (keys['s'] || keys['S']) p1.y += 6;

      if (mode === '2p') {
        if (keys['ArrowUp']) p2.y -= 6;
        if (keys['ArrowDown']) p2.y += 6;
      } else {
        // AI
        const center = p2.y + p2.h / 2;
        if (ball.vx > 0) {
          if (center < ball.y - 10) p2.y += 4.5;
          else if (center > ball.y + 10) p2.y -= 4.5;
        }
      }

      // Constrain paddles
      p1.y = Math.max(0, Math.min(canvas.height - p1.h, p1.y));
      p2.y = Math.max(0, Math.min(canvas.height - p2.h, p2.y));

      // Move ball
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top / bottom bounce
      if (ball.y - ball.r < 0) {
        ball.y = ball.r;
        ball.vy = -ball.vy;
        beep(350, 0.05);
      } else if (ball.y + ball.r > canvas.height) {
        ball.y = canvas.height - ball.r;
        ball.vy = -ball.vy;
        beep(350, 0.05);
      }

      // Paddle 1 Hit
      if (
        ball.x - ball.r <= 25 &&
        ball.x + ball.r >= 15 &&
        ball.y >= p1.y &&
        ball.y <= p1.y + p1.h
      ) {
        ball.vx = Math.abs(ball.vx) * 1.05; // speed up
        const hit = (ball.y - (p1.y + p1.h / 2)) / (p1.h / 2);
        ball.vy = hit * 5;
        beep(520, 0.06);
      }

      // Paddle 2 Hit
      if (
        ball.x + ball.r >= canvas.width - 25 &&
        ball.x - ball.r <= canvas.width - 15 &&
        ball.y >= p2.y &&
        ball.y <= p2.y + p2.h
      ) {
        ball.vx = -Math.abs(ball.vx) * 1.05;
        const hit = (ball.y - (p2.y + p2.h / 2)) / (p2.h / 2);
        ball.vy = hit * 5;
        beep(520, 0.06);
      }

      // Point scoring
      if (ball.x < 0) {
        p2.score++;
        p2El.textContent = p2.score;
        beep(220, 0.2);
        serveBall(1);
      } else if (ball.x > canvas.width) {
        p1.score++;
        p1El.textContent = p1.score;
        beep(660, 0.2);
        serveBall(-1);
      }
    }

    function draw() {
      ctx.fillStyle = '#050814';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dividing line
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // P1 Paddle
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(15, p1.y, p1.w, p1.h);

      // P2 Paddle
      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(canvas.width - 25, p2.y, p2.w, p2.h);

      // Ball
      ctx.fillStyle = '#f8fafc';
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      update();
      requestAnimationFrame(draw);
    }

    serveBall(1);
    requestAnimationFrame(draw);
  </script>
</body>
</html>
