<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Block Fall Classic</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
      touch-action: none;
      padding: 12px;
    }
    .game-layout {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      background: #0f172a;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #1e293b;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #tetris-canvas {
      background: #000;
      border: 2px solid #334155;
      border-radius: 6px;
      display: block;
    }
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 110px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }
    .card-label {
      font-size: 10px;
      text-transform: uppercase;
      color: #94a3b8;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .card-val {
      font-size: 18px;
      font-weight: 800;
      color: #38bdf8;
    }
    #next-canvas {
      background: #090d16;
      border-radius: 6px;
      margin: 4px auto 0;
      display: block;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { background: #38bdf8; }
    .controls {
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
      line-height: 1.4;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: 12px;
      z-index: 10;
    }
    #overlay h2 {
      font-size: 28px;
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div style="position: relative;">
    <div class="game-layout">
      <canvas id="tetris-canvas" width="200" height="400"></canvas>
      <div class="side-panel">
        <div class="card">
          <div class="card-label">Score</div>
          <div class="card-val" id="score">0</div>
        </div>
        <div class="card">
          <div class="card-label">Lines</div>
          <div class="card-val" id="lines">0</div>
        </div>
        <div class="card">
          <div class="card-label">Level</div>
          <div class="card-val" id="level">1</div>
        </div>
        <div class="card">
          <div class="card-label">Next</div>
          <canvas id="next-canvas" width="80" height="80"></canvas>
        </div>
        <button class="btn" onclick="start()">Restart</button>
      </div>
    </div>

    <div id="overlay">
      <h2>GAME OVER</h2>
      <p style="color:#cbd5e1">Score: <span id="final-score">0</span></p>
      <button class="btn" onclick="start()">Play Again</button>
    </div>
  </div>

  <div class="controls">
    ← / → : Move &nbsp;|&nbsp; ↑ : Rotate &nbsp;|&nbsp; ↓ : Soft Drop &nbsp;|&nbsp; Space : Hard Drop
  </div>

  <script>
    const canvas = document.getElementById('tetris-canvas');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next-canvas');
    const nextCtx = nextCanvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const linesEl = document.getElementById('lines');
    const levelEl = document.getElementById('level');
    const overlay = document.getElementById('overlay');
    const finalScoreEl = document.getElementById('final-score');

    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 20;

    const SHAPES = [
      { color: '#38bdf8', shape: [[1,1,1,1]] }, // I
      { color: '#eab308', shape: [[1,1],[1,1]] }, // O
      { color: '#a855f7', shape: [[0,1,0],[1,1,1]] }, // T
      { color: '#22c55e', shape: [[0,1,1],[1,1,0]] }, // S
      { color: '#ef4444', shape: [[1,1,0],[0,1,1]] }, // Z
      { color: '#3b82f6', shape: [[1,0,0],[1,1,1]] }, // J
      { color: '#f97316', shape: [[0,0,1],[1,1,1]] }, // L
    ];

    let grid = [];
    let currentPiece = null;
    let nextPiece = null;
    let score = 0;
    let lines = 0;
    let level = 1;
    let dropCounter = 0;
    let lastTime = 0;
    let isGameOver = false;

    function createMatrix(w, h) {
      const m = [];
      while (h--) m.push(new Array(w).fill(0));
      return m;
    }

    function randomPiece() {
      const type = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      return {
        shape: type.shape,
        color: type.color,
        x: Math.floor(COLS / 2) - Math.ceil(type.shape[0].length / 2),
        y: 0
      };
    }

    function collide(grid, piece) {
      const m = piece.shape;
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0) {
            const gy = y + piece.y;
            const gx = x + piece.x;
            if (gy >= ROWS || gx < 0 || gx >= COLS || (gy >= 0 && grid[gy][gx])) {
              return true;
            }
          }
        }
      }
      return false;
    }

    function rotate(matrix) {
      const N = matrix.length;
      const M = matrix[0].length;
      const result = [];
      for (let i = 0; i < M; i++) {
        result.push(new Array(N).fill(0));
      }
      for (let y = 0; y < N; y++) {
        for (let x = 0; x < M; x++) {
          result[x][N - 1 - y] = matrix[y][x];
        }
      }
      return result;
    }

    function playerRotate() {
      const original = currentPiece.shape;
      currentPiece.shape = rotate(currentPiece.shape);
      if (collide(grid, currentPiece)) {
        currentPiece.shape = original; // rollback
      }
    }

    function merge(grid, piece) {
      piece.shape.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            grid[y + piece.y][x + piece.x] = piece.color;
          }
        });
      });
    }

    function arenaSweep() {
      let rowCount = 0;
      outer: for (let y = grid.length - 1; y >= 0; --y) {
        for (let x = 0; x < grid[y].length; ++x) {
          if (!grid[y][x]) continue outer;
        }
        const row = grid.splice(y, 1)[0].fill(0);
        grid.unshift(row);
        ++y;
        rowCount++;
      }
      if (rowCount > 0) {
        lines += rowCount;
        score += [0, 40, 100, 300, 1200][rowCount] * level;
        level = Math.floor(lines / 10) + 1;
        scoreEl.textContent = score;
        linesEl.textContent = lines;
        levelEl.textContent = level;
      }
    }

    function playerDrop() {
      currentPiece.y++;
      if (collide(grid, currentPiece)) {
        currentPiece.y--;
        merge(grid, currentPiece);
        arenaSweep();
        currentPiece = nextPiece;
        nextPiece = randomPiece();
        drawNext();
        if (collide(grid, currentPiece)) {
          endGame();
        }
      }
      dropCounter = 0;
    }

    function hardDrop() {
      while (!collide(grid, currentPiece)) {
        currentPiece.y++;
      }
      currentPiece.y--;
      playerDrop();
    }

    function endGame() {
      isGameOver = true;
      finalScoreEl.textContent = score;
      overlay.style.display = 'flex';
    }

    function start() {
      grid = createMatrix(COLS, ROWS);
      score = 0;
      lines = 0;
      level = 1;
      scoreEl.textContent = 0;
      linesEl.textContent = 0;
      levelEl.textContent = 1;
      overlay.style.display = 'none';
      isGameOver = false;
      currentPiece = randomPiece();
      nextPiece = randomPiece();
      drawNext();
      lastTime = 0;
      dropCounter = 0;
    }

    function drawNext() {
      nextCtx.fillStyle = '#090d16';
      nextCtx.fillRect(0, 0, 80, 80);
      const m = nextPiece.shape;
      const offX = (80 - m[0].length * 16) / 2;
      const offY = (80 - m.length * 16) / 2;

      m.forEach((row, y) => {
        row.forEach((val, x) => {
          if (val) {
            nextCtx.fillStyle = nextPiece.color;
            nextCtx.fillRect(offX + x * 16 + 1, offY + y * 16 + 1, 14, 14);
          }
        });
      });
    }

    function draw() {
      ctx.fillStyle = '#050811';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * BLOCK, 0);
        ctx.lineTo(x * BLOCK, ROWS * BLOCK);
        ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * BLOCK);
        ctx.lineTo(COLS * BLOCK, y * BLOCK);
        ctx.stroke();
      }

      // Draw placed blocks
      grid.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value) {
            ctx.fillStyle = value;
            ctx.fillRect(x * BLOCK + 1, y * BLOCK + 1, BLOCK - 2, BLOCK - 2);
          }
        });
      });

      // Draw current piece
      if (currentPiece) {
        currentPiece.shape.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value) {
              ctx.fillStyle = currentPiece.color;
              ctx.fillRect((currentPiece.x + x) * BLOCK + 1, (currentPiece.y + y) * BLOCK + 1, BLOCK - 2, BLOCK - 2);
            }
          });
        });
      }
    }

    function update(time = 0) {
      if (isGameOver) {
        requestAnimationFrame(update);
        return;
      }

      const deltaTime = time - lastTime;
      lastTime = time;
      dropCounter += deltaTime;

      const dropInterval = Math.max(100, 1000 - (level - 1) * 80);
      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    window.addEventListener('keydown', (e) => {
      if (isGameOver) return;
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') {
        currentPiece.x--;
        if (collide(grid, currentPiece)) currentPiece.x++;
        e.preventDefault();
      } else if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') {
        currentPiece.x++;
        if (collide(grid, currentPiece)) currentPiece.x--;
        e.preventDefault();
      } else if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') {
        playerDrop();
        e.preventDefault();
      } else if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') {
        playerRotate();
        e.preventDefault();
      } else if (e.key === ' ') {
        hardDrop();
        e.preventDefault();
      }
    });

    start();
    requestAnimationFrame(update);
  </script>
</body>
</html>
