<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retro Snake DX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
      touch-action: none;
      padding: 12px;
    }
    .hud {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: #0f172a;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }
    .stat {
      display: flex;
      flex-direction: column;
    }
    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
    }
    .stat-val {
      font-size: 20px;
      font-weight: 700;
      color: #38bdf8;
    }
    #game-box {
      position: relative;
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1 / 1;
      background: #090d16;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #game-over {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    #game-over h2 {
      font-size: 32px;
      color: #ef4444;
      letter-spacing: 1px;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:hover { background: #38bdf8; }
    .controls-hint {
      margin-top: 12px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="stat">
      <span class="stat-label">Score</span>
      <span class="stat-val" id="score">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Length</span>
      <span class="stat-val" id="length">3</span>
    </div>
    <div class="stat">
      <span class="stat-label">Best</span>
      <span class="stat-val" id="best">0</span>
    </div>
  </div>

  <div id="game-box">
    <canvas id="snake-canvas" width="400" height="400"></canvas>
    <div id="game-over">
      <h2>GAME OVER</h2>
      <p style="color:#cbd5e1">Score: <span id="final-score">0</span></p>
      <button class="btn" onclick="start()">PLAY AGAIN</button>
    </div>
  </div>

  <div class="controls-hint">Arrow Keys / WASD or swipe to change direction</div>

  <script>
    const canvas = document.getElementById('snake-canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const lengthEl = document.getElementById('length');
    const bestEl = document.getElementById('best');
    const gameOverEl = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');

    const GRID = 20;
    const COLS = 20;
    const ROWS = 20;

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 10, y: 10, type: 'normal' };
    let score = 0;
    let best = parseInt(localStorage.getItem('snake_best') || '0', 10);
    bestEl.textContent = best;
    let isGameOver = false;
    let gameLoop = null;

    let audioCtx = null;
    function beep(freq, dur) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.frequency.value = freq;
        g.gain.value = 0.08;
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function spawnFood() {
      let valid = false;
      let x, y;
      while (!valid) {
        x = Math.floor(Math.random() * COLS);
        y = Math.floor(Math.random() * ROWS);
        valid = !snake.some(segment => segment.x === x && segment.y === y);
      }
      food = {
        x, y,
        isGolden: Math.random() < 0.2
      };
    }

    function start() {
      gameOverEl.style.display = 'none';
      snake = [
        { x: 5, y: 10 },
        { x: 4, y: 10 },
        { x: 3, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = 0;
      lengthEl.textContent = snake.length;
      isGameOver = false;
      spawnFood();

      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(tick, 90);
    }

    function tick() {
      dir = { ...nextDir };
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        endGame();
        return;
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        const points = food.isGolden ? 50 : 10;
        score += points;
        scoreEl.textContent = score;
        lengthEl.textContent = snake.length;
        if (score > best) {
          best = score;
          localStorage.setItem('snake_best', best);
          bestEl.textContent = best;
        }
        beep(food.isGolden ? 880 : 540, 0.1);
        spawnFood();
      } else {
        snake.pop();
      }

      render();
    }

    function endGame() {
      isGameOver = true;
      clearInterval(gameLoop);
      beep(150, 0.3);
      finalScoreEl.textContent = score;
      gameOverEl.style.display = 'flex';
    }

    function render() {
      // Clear
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid dots
      ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
      for (let x = 0; x < COLS; x++) {
        for (let y = 0; y < ROWS; y++) {
          ctx.fillRect(x * GRID + 9, y * GRID + 9, 2, 2);
        }
      }

      // Food
      if (food.isGolden) {
        ctx.fillStyle = '#eab308';
        ctx.shadowColor = '#eab308';
        ctx.shadowBlur = 12;
      } else {
        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 8;
      }
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake
      snake.forEach((seg, i) => {
        if (i === 0) {
          ctx.fillStyle = '#38bdf8'; // Head
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 10;
        } else {
          ctx.fillStyle = '#0284c7'; // Body
          ctx.shadowBlur = 0;
        }
        ctx.beginPath();
        ctx.roundRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2, 4);
        ctx.fill();
      });
      ctx.shadowBlur = 0;
    }

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if ((k === 'arrowup' || k === 'w') && dir.y === 0) { nextDir = { x: 0, y: -1 }; e.preventDefault(); }
      if ((k === 'arrowdown' || k === 's') && dir.y === 0) { nextDir = { x: 0, y: 1 }; e.preventDefault(); }
      if ((k === 'arrowleft' || k === 'a') && dir.x === 0) { nextDir = { x: -1, y: 0 }; e.preventDefault(); }
      if ((k === 'arrowright' || k === 'd') && dir.x === 0) { nextDir = { x: 1, y: 0 }; e.preventDefault(); }
      if (k === ' ' && isGameOver) start();
    });

    // Touch Swipe
    let sx = 0, sy = 0;
    canvas.addEventListener('touchstart', e => {
      sx = e.touches[0].clientX;
      sy = e.touches[0].clientY;
    });
    canvas.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 25 || Math.abs(dy) > 25) {
        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx > 0 && dir.x === 0) nextDir = { x: 1, y: 0 };
          else if (dx < 0 && dir.x === 0) nextDir = { x: -1, y: 0 };
        } else {
          if (dy > 0 && dir.y === 0) nextDir = { x: 0, y: 1 };
          else if (dy < 0 && dir.y === 0) nextDir = { x: 0, y: -1 };
        }
      }
    });

    start();
  </script>
</body>
</html>
