<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048 Arcade</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
      touch-action: none;
      padding: 16px;
    }
    .header {
      width: 100%;
      max-width: 380px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .title {
      font-size: 38px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: -1px;
    }
    .scores {
      display: flex;
      gap: 8px;
    }
    .score-box {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 8px;
      text-align: center;
      min-width: 70px;
    }
    .score-box .label {
      font-size: 10px;
      text-transform: uppercase;
      color: #94a3b8;
      font-weight: 600;
    }
    .score-box .val {
      font-size: 18px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .toolbar {
      width: 100%;
      max-width: 380px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #0369a1; }
    .btn-secondary {
      background: #334155;
    }
    .btn-secondary:hover { background: #475569; }

    #board-container {
      position: relative;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1 / 1;
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 10px;
      border: 2px solid #334155;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }
    .cell {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      transition: transform 0.1s ease-in-out;
    }

    /* Tile numbers coloring */
    .tile-2    { background: #334155; color: #f8fafc; }
    .tile-4    { background: #475569; color: #f8fafc; }
    .tile-8    { background: #0284c7; color: #ffffff; }
    .tile-16   { background: #0369a1; color: #ffffff; }
    .tile-32   { background: #0d9488; color: #ffffff; }
    .tile-64   { background: #059669; color: #ffffff; }
    .tile-128  { background: #d97706; color: #ffffff; font-size: 22px; }
    .tile-256  { background: #ea580c; color: #ffffff; font-size: 22px; }
    .tile-512  { background: #e11d48; color: #ffffff; font-size: 22px; }
    .tile-1024 { background: #9333ea; color: #ffffff; font-size: 18px; }
    .tile-2048 { background: #eab308; color: #000000; font-size: 18px; box-shadow: 0 0 15px #eab308; }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      border-radius: 12px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
    }
    #overlay h2 {
      font-size: 32px;
      color: #38bdf8;
    }
    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box">
        <div class="label">Score</div>
        <div class="val" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="label">Best</div>
        <div class="val" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn btn-secondary" onclick="undo()">↩ Undo</button>
    <button class="btn" onclick="init()">New Game</button>
  </div>

  <div id="board-container">
    <div id="overlay">
      <h2 id="overlay-msg">Game Over!</h2>
      <button class="btn" onclick="init()">Try Again</button>
    </div>
    <!-- 16 cells -->
  </div>

  <div class="hint">Use Arrow keys, WASD, or swipe to merge matching tiles!</div>

  <script>
    let board = [];
    let prevBoard = null;
    let score = 0;
    let prevScore = 0;
    let best = parseInt(localStorage.getItem('2048_best') || '0', 10);
    document.getElementById('best').textContent = best;

    const boardEl = document.getElementById('board-container');
    const overlay = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');

    function init() {
      overlay.style.display = 'none';
      board = Array(16).fill(0);
      score = 0;
      updateScore(0);
      addRandomTile();
      addRandomTile();
      render();
    }

    function addRandomTile() {
      const emptyIndices = [];
      for (let i = 0; i < 16; i++) {
        if (board[i] === 0) emptyIndices.push(i);
      }
      if (emptyIndices.length > 0) {
        const idx = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
        board[idx] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function render() {
      // Clear all cells except overlay
      const cells = boardEl.querySelectorAll('.cell');
      cells.forEach(c => c.remove());

      for (let i = 0; i < 16; i++) {
        const val = board[i];
        const cell = document.createElement('div');
        cell.className = 'cell' + (val > 0 ? ` tile-${val}` : '');
        cell.textContent = val > 0 ? val : '';
        boardEl.appendChild(cell);
      }
    }

    function updateScore(add) {
      score += add;
      document.getElementById('score').textContent = score;
      if (score > best) {
        best = score;
        localStorage.setItem('2048_best', best);
        document.getElementById('best').textContent = best;
      }
    }

    function slideRow(row) {
      let arr = row.filter(x => x !== 0);
      let addScore = 0;
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2;
          addScore += arr[i];
          arr[i + 1] = 0;
        }
      }
      arr = arr.filter(x => x !== 0);
      while (arr.length < 4) arr.push(0);
      return { row: arr, addScore };
    }

    function move(dir) {
      prevBoard = [...board];
      prevScore = score;
      let moved = false;
      let totalAdd = 0;

      for (let i = 0; i < 4; i++) {
        let row = [];
        for (let j = 0; j < 4; j++) {
          let idx;
          if (dir === 'left')  idx = i * 4 + j;
          if (dir === 'right') idx = i * 4 + (3 - j);
          if (dir === 'up')    idx = j * 4 + i;
          if (dir === 'down')  idx = (3 - j) * 4 + i;
          row.push(board[idx]);
        }

        const { row: newRow, addScore } = slideRow(row);
        totalAdd += addScore;

        for (let j = 0; j < 4; j++) {
          let idx;
          if (dir === 'left')  idx = i * 4 + j;
          if (dir === 'right') idx = i * 4 + (3 - j);
          if (dir === 'up')    idx = j * 4 + i;
          if (dir === 'down')  idx = (3 - j) * 4 + i;

          if (board[idx] !== newRow[j]) moved = true;
          board[idx] = newRow[j];
        }
      }

      if (moved) {
        updateScore(totalAdd);
        addRandomTile();
        render();

        if (checkWin()) {
          overlayMsg.textContent = 'You Win 2048!';
          overlay.style.display = 'flex';
        } else if (checkGameOver()) {
          overlayMsg.textContent = 'Game Over!';
          overlay.style.display = 'flex';
        }
      }
    }

    function undo() {
      if (prevBoard) {
        board = [...prevBoard];
        score = prevScore;
        document.getElementById('score').textContent = score;
        overlay.style.display = 'none';
        render();
        prevBoard = null;
      }
    }

    function checkWin() {
      return board.some(x => x === 2048);
    }

    function checkGameOver() {
      if (board.includes(0)) return false;
      for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 4; j++) {
          const val = board[i * 4 + j];
          if (j < 3 && val === board[i * 4 + j + 1]) return false;
          if (i < 3 && val === board[(i + 1) * 4 + j]) return false;
        }
      }
      return true;
    }

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft'  || e.key.toLowerCase() === 'a') { e.preventDefault(); move('left'); }
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') { e.preventDefault(); move('right'); }
      if (e.key === 'ArrowUp'    || e.key.toLowerCase() === 'w') { e.preventDefault(); move('up'); }
      if (e.key === 'ArrowDown'  || e.key.toLowerCase() === 's') { e.preventDefault(); move('down'); }
    });

    // Touch Swipe
    let touchStartX = 0;
    let touchStartY = 0;
    boardEl.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: false });

    boardEl.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
        if (Math.abs(dx) > Math.abs(dy)) {
          move(dx > 0 ? 'right' : 'left');
        } else {
          move(dy > 0 ? 'down' : 'up');
        }
      }
    }, { passive: false });

    init();
  </script>
</body>
</html>
