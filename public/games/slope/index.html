<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Slope 3D Runner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050510;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
      color: #fff;
    }
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 18px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    .badge {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }
    #game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 16, 0.85);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      pointer-events: auto;
    }
    #game-over-screen h1 {
      font-size: 42px;
      color: #ef4444;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #restart-btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px 32px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }
    #restart-btn:hover {
      background: #38bdf8;
      transform: scale(1.05);
    }
    #touch-controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 24px;
      pointer-events: none;
    }
    .touch-btn {
      width: 70px;
      height: 70px;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div class="badge">SCORE: <span id="score-val">0</span></div>
    <div class="badge">BEST: <span id="best-val">0</span></div>
    <div class="badge">SPEED: <span id="speed-val">1.0x</span></div>
  </div>

  <div id="game-over-screen">
    <h1>CRASHED</h1>
    <p style="font-size: 20px;">Score: <span id="final-score">0</span></p>
    <button id="restart-btn" onclick="startGame()">PLAY AGAIN</button>
  </div>

  <div id="touch-controls">
    <div class="touch-btn" id="btn-left">◀</div>
    <div class="touch-btn" id="btn-right">▶</div>
  </div>

  <canvas id="game-canvas"></canvas>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('score-val');
    const bestVal = document.getElementById('best-val');
    const speedVal = document.getElementById('speed-val');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScore = document.getElementById('final-score');

    let bestScore = parseInt(localStorage.getItem('slope_best') || '0', 10);
    bestVal.textContent = bestScore;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game state
    let isPlaying = false;
    let score = 0;
    let ball = { x: 0, y: 0, vx: 0, radius: 16 };
    let speed = 1.0;
    let roadSegments = [];
    let obstacles = [];
    let distance = 0;
    let keys = { left: false, right: false };

    // Audio context for sound effects
    let audioCtx = null;
    function playBeep(freq, duration, type='sine') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = true;
      if (e.key === ' ' && !isPlaying) startGame();
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = false;
    });

    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
    btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
    btnRight.addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });

    function startGame() {
      gameOverScreen.style.display = 'none';
      ball = { x: 0, y: 0, vx: 0, radius: 18 };
      speed = 1.0;
      score = 0;
      distance = 0;
      roadSegments = [];
      obstacles = [];

      // Generate initial track segments
      for (let i = 0; i < 40; i++) {
        addSegment(i * 40);
      }
      isPlaying = true;
      playBeep(440, 0.1);
    }

    function addSegment(z) {
      const width = 340;
      const seg = { z, width, xOffset: Math.sin(z * 0.003) * 60 };
      roadSegments.push(seg);

      if (z > 400 && Math.random() < 0.35) {
        // Obstacle
        const obW = 50 + Math.random() * 40;
        const obX = (Math.random() - 0.5) * (width - obW);
        obstacles.push({ z, x: obX, w: obW, h: 40 });
      }
    }

    function project(x, y, z) {
      const fov = 350;
      const camZ = -200;
      const relZ = z - distance - camZ;
      if (relZ <= 1) return null;
      const scale = fov / relZ;
      const projX = canvas.width / 2 + (x * scale);
      const projY = canvas.height * 0.45 + (y * scale) + (relZ * 0.12);
      return { x: projX, y: projY, scale };
    }

    function update() {
      if (!isPlaying) return;

      // Handle steering
      const accel = 0.85;
      if (keys.left) ball.vx -= accel;
      if (keys.right) ball.vx += accel;
      ball.vx *= 0.88;
      ball.x += ball.vx;

      // Speed increases gradually
      speed += 0.0004;
      const moveStep = 9 * speed;
      distance += moveStep;
      score = Math.floor(distance / 20);
      scoreVal.textContent = score;
      speedVal.textContent = speed.toFixed(1) + 'x';

      // Remove passed segments and add new ones
      while (roadSegments.length > 0 && roadSegments[0].z < distance - 100) {
        roadSegments.shift();
      }
      while (roadSegments.length < 50) {
        const lastZ = roadSegments[roadSegments.length - 1].z;
        addSegment(lastZ + 40);
      }

      // Check track bounds
      const currentTrackWidth = 170;
      if (Math.abs(ball.x) > currentTrackWidth) {
        gameOver();
        return;
      }

      // Check obstacle collisions
      for (const ob of obstacles) {
        if (Math.abs(ob.z - distance) < 25) {
          if (ball.x > ob.x - ob.w/2 - ball.radius && ball.x < ob.x + ob.w/2 + ball.radius) {
            gameOver();
            return;
          }
        }
      }

      // Filter passed obstacles
      obstacles = obstacles.filter(o => o.z >= distance - 50);
    }

    function gameOver() {
      isPlaying = false;
      playBeep(160, 0.4, 'sawtooth');
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('slope_best', bestScore);
        bestVal.textContent = bestScore;
      }
      finalScore.textContent = score;
      gameOverScreen.style.display = 'flex';
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Deep space grid gradient
      const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bgGrad.addColorStop(0, '#020617');
      bgGrad.addColorStop(1, '#0f172a');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Distant neon horizon grid
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.12)';
      ctx.lineWidth = 1;
      const horizon = canvas.height * 0.45;
      for (let i = -10; i <= 10; i++) {
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2 + i * 80, horizon);
        ctx.lineTo(canvas.width / 2 + i * 300, canvas.height);
        ctx.stroke();
      }

      // Draw road segments back to front
      for (let i = roadSegments.length - 1; i >= 1; i--) {
        const s1 = roadSegments[i];
        const s0 = roadSegments[i - 1];
        const p1 = project(s1.xOffset, 120, s1.z);
        const p0 = project(s0.xOffset, 120, s0.z);

        if (!p1 || !p0) continue;

        const w1 = (s1.width / 2) * p1.scale;
        const w0 = (s0.width / 2) * p0.scale;

        // Striped road pattern
        const isAlt = Math.floor(s0.z / 80) % 2 === 0;
        ctx.fillStyle = isAlt ? '#0284c7' : '#0369a1';
        ctx.beginPath();
        ctx.moveTo(p0.x - w0, p0.y);
        ctx.lineTo(p0.x + w0, p0.y);
        ctx.lineTo(p1.x + w1, p1.y);
        ctx.lineTo(p1.x - w1, p1.y);
        ctx.closePath();
        ctx.fill();

        // Glowing edge borders
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = Math.max(1, 2 * p0.scale);
        ctx.beginPath();
        ctx.moveTo(p0.x - w0, p0.y);
        ctx.lineTo(p1.x - w1, p1.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(p0.x + w0, p0.y);
        ctx.lineTo(p1.x + w1, p1.y);
        ctx.stroke();
      }

      // Draw obstacles
      for (const ob of obstacles) {
        if (ob.z < distance || ob.z > distance + 1400) continue;
        const p = project(ob.x, 100, ob.z);
        if (!p) continue;

        const ow = ob.w * p.scale;
        const oh = ob.h * p.scale;

        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#dc2626';
        ctx.shadowBlur = 12;
        ctx.fillRect(p.x - ow/2, p.y - oh, ow, oh);
        ctx.shadowBlur = 0;

        ctx.strokeStyle = '#fca5a5';
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x - ow/2, p.y - oh, ow, oh);
      }

      // Draw ball
      const ballProj = project(ball.x, 95, distance + 30);
      if (ballProj) {
        const br = ball.radius * ballProj.scale;
        
        // Ball shadow
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(ballProj.x, ballProj.y + br * 0.9, br * 1.1, br * 0.4, 0, 0, Math.PI * 2);
        ctx.fill();

        // Ball body
        const grad = ctx.createRadialGradient(
          ballProj.x - br * 0.3, ballProj.y - br * 0.3, br * 0.1,
          ballProj.x, ballProj.y, br
        );
        grad.addColorStop(0, '#fef08a');
        grad.addColorStop(0.5, '#eab308');
        grad.addColorStop(1, '#ca8a04');

        ctx.fillStyle = grad;
        ctx.shadowColor = '#eab308';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(ballProj.x, ballProj.y, br, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      update();
      requestAnimationFrame(draw);
    }

    startGame();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
