<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Bird Remastered</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 700px;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      background: #70c5ce;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="flappy-canvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('flappy-canvas');
    const ctx = canvas.getContext('2d');

    const W = 360;
    const H = 600;
    canvas.width = W;
    canvas.height = H;

    let audioCtx = null;
    function playTone(freq, dur, type='sine') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.12, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    let state = 'START'; // START, PLAYING, GAMEOVER
    let bird = { x: 80, y: 250, vy: 0, radius: 14 };
    let pipes = [];
    let score = 0;
    let best = parseInt(localStorage.getItem('flappy_best') || '0', 10);
    let frames = 0;

    function reset() {
      bird = { x: 80, y: 250, vy: 0, radius: 14 };
      pipes = [];
      score = 0;
      frames = 0;
      state = 'START';
    }

    function jump() {
      if (state === 'START') {
        state = 'PLAYING';
        bird.vy = -7.5;
        playTone(520, 0.1);
      } else if (state === 'PLAYING') {
        bird.vy = -7.5;
        playTone(520, 0.1);
      } else if (state === 'GAMEOVER') {
        reset();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        jump();
      }
    });
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      jump();
    });

    function update() {
      frames++;

      if (state === 'PLAYING') {
        bird.vy += 0.38; // Gravity
        bird.y += bird.vy;

        // Ground / Ceiling collision
        if (bird.y + bird.radius >= H - 80 || bird.y - bird.radius <= 0) {
          gameOver();
        }

        // Spawn pipes
        if (frames % 90 === 0) {
          const gap = 135;
          const topH = 60 + Math.random() * (H - 240);
          pipes.push({
            x: W,
            topH: topH,
            bottomY: topH + gap,
            passed: false
          });
        }

        // Move pipes
        for (let i = 0; i < pipes.length; i++) {
          const p = pipes[i];
          p.x -= 2.6;

          // Check score pass
          if (!p.passed && p.x + 50 < bird.x) {
            p.passed = true;
            score++;
            playTone(880, 0.12);
            if (score > best) {
              best = score;
              localStorage.setItem('flappy_best', best);
            }
          }

          // Pipe collision
          if (
            bird.x + bird.radius > p.x &&
            bird.x - bird.radius < p.x + 52
          ) {
            if (bird.y - bird.radius < p.topH || bird.y + bird.radius > p.bottomY) {
              gameOver();
            }
          }
        }

        // Remove offscreen pipes
        pipes = pipes.filter(p => p.x > -60);
      }
    }

    function gameOver() {
      state = 'GAMEOVER';
      playTone(180, 0.3, 'sawtooth');
    }

    function draw() {
      // Sky
      const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
      skyGrad.addColorStop(0, '#38bdf8');
      skyGrad.addColorStop(0.7, '#bae6fd');
      skyGrad.addColorStop(1, '#fed7aa');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, H);

      // Clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
      ctx.beginPath();
      ctx.arc(80, 100, 30, 0, Math.PI * 2);
      ctx.arc(120, 95, 40, 0, Math.PI * 2);
      ctx.arc(160, 100, 30, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(260, 160, 25, 0, Math.PI * 2);
      ctx.arc(295, 155, 32, 0, Math.PI * 2);
      ctx.arc(330, 160, 25, 0, Math.PI * 2);
      ctx.fill();

      // Pipes
      for (const p of pipes) {
        // Top Pipe
        ctx.fillStyle = '#22c55e';
        ctx.strokeStyle = '#15803d';
        ctx.lineWidth = 3;
        ctx.fillRect(p.x, 0, 52, p.topH);
        ctx.strokeRect(p.x, 0, 52, p.topH);

        // Top Pipe Rim
        ctx.fillRect(p.x - 4, p.topH - 20, 60, 20);
        ctx.strokeRect(p.x - 4, p.topH - 20, 60, 20);

        // Bottom Pipe
        const bH = (H - 80) - p.bottomY;
        ctx.fillRect(p.x, p.bottomY, 52, bH);
        ctx.strokeRect(p.x, p.bottomY, 52, bH);

        // Bottom Pipe Rim
        ctx.fillRect(p.x - 4, p.bottomY, 60, 20);
        ctx.strokeRect(p.x - 4, p.bottomY, 60, 20);
      }

      // Ground
      ctx.fillStyle = '#ca8a04';
      ctx.fillRect(0, H - 80, W, 80);
      ctx.fillStyle = '#16a34a';
      ctx.fillRect(0, H - 80, W, 12);

      // Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      let angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.vy * 0.08)));
      ctx.rotate(angle);

      // Body
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ca8a04';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Wing
      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      ctx.ellipse(-4, 2, 7, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(6, -4, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(7.5, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#ea580c';
      ctx.beginPath();
      ctx.moveTo(11, -1);
      ctx.lineTo(20, 2);
      ctx.lineTo(11, 6);
      ctx.closePath();
      ctx.fill();

      ctx.restore();

      // Score HUD
      if (state === 'PLAYING') {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#000';
        ctx.strokeText(score, W / 2, 60);
        ctx.fillText(score, W / 2, 60);
      } else if (state === 'START') {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#0f172a';
        ctx.strokeText('FLAPPY BIRD', W / 2, 180);
        ctx.fillText('FLAPPY BIRD', W / 2, 180);

        ctx.font = '16px sans-serif';
        ctx.fillStyle = '#0f172a';
        ctx.fillText('Tap or press Space to fly', W / 2, 230);
      } else if (state === 'GAMEOVER') {
        // Game Over Panel
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(35, 140, W - 70, 220);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.strokeRect(35, 140, W - 70, 220);

        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W / 2, 185);

        ctx.fillStyle = '#cbd5e1';
        ctx.font = '18px sans-serif';
        ctx.fillText(`Score: ${score}`, W / 2, 230);
        ctx.fillText(`Best: ${best}`, W / 2, 260);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText('Tap to Play Again', W / 2, 315);
      }

      update();
      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
