<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cookie Clicker Mini</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      padding: 16px;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      max-width: 600px;
      margin-top: 10px;
    }
    @media (max-width: 500px) {
      .container { grid-template-columns: 1fr; }
    }
    .cookie-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1e293b;
      padding: 24px 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .cookie-btn {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #d97706, #92400e);
      border: 5px solid #78350f;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 -4px 8px rgba(0,0,0,0.4);
      cursor: pointer;
      position: relative;
      transition: transform 0.08s ease;
      margin: 16px 0;
      touch-action: manipulation;
    }
    .cookie-btn:active {
      transform: scale(0.92);
    }
    /* Choc chips */
    .chip {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #451a03;
      border-radius: 50%;
    }
    .c1 { top: 25px; left: 35px; width: 14px; height: 14px; }
    .c2 { top: 65px; left: 25px; }
    .c3 { top: 40px; right: 30px; width: 16px; height: 16px; }
    .c4 { bottom: 25px; right: 40px; }
    .c5 { bottom: 35px; left: 50px; width: 14px; height: 14px; }
    .c6 { top: 75px; left: 75px; }

    .stats-title {
      font-size: 26px;
      font-weight: 800;
      color: #fbbf24;
    }
    .cps-sub {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .shop-section {
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 380px;
      overflow-y: auto;
    }
    .shop-header {
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .shop-item:hover:not(.disabled) {
      border-color: #fbbf24;
      background: #172554;
    }
    .shop-item.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .item-info {
      display: flex;
      flex-direction: column;
    }
    .item-name {
      font-weight: 700;
      font-size: 14px;
    }
    .item-desc {
      font-size: 11px;
      color: #94a3b8;
    }
    .item-cost {
      font-weight: 700;
      font-size: 13px;
      color: #fbbf24;
      text-align: right;
    }
    .item-count {
      font-size: 11px;
      color: #38bdf8;
    }

    .float-text {
      position: absolute;
      font-weight: 800;
      color: #fbbf24;
      pointer-events: none;
      animation: floatUp 0.7s ease-out forwards;
      font-size: 18px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-40px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="cookie-section" id="cookie-area">
      <div class="stats-title" id="cookies-count">0</div>
      <div class="cps-sub"><span id="cps-count">0</span> cookies per second</div>

      <div class="cookie-btn" id="cookie" onclick="clickCookie(event)">
        <div class="chip c1"></div>
        <div class="chip c2"></div>
        <div class="chip c3"></div>
        <div class="chip c4"></div>
        <div class="chip c5"></div>
        <div class="chip c6"></div>
      </div>

      <div style="font-size: 12px; color: #64748b;">Click the golden cookie!</div>
    </div>

    <div class="shop-section">
      <div class="shop-header">Bakery Upgrades</div>
      <div id="shop-list"></div>
    </div>
  </div>

  <script>
    let cookies = parseFloat(localStorage.getItem('cookie_total') || '0');
    let items = [
      { id: 'cursor', name: 'Auto-Clicker', baseCost: 15, cost: 15, cps: 0.5, count: 0 },
      { id: 'grandma', name: 'Cookie Grandma', baseCost: 100, cost: 100, cps: 4, count: 0 },
      { id: 'bakery', name: 'Corner Bakery', baseCost: 1100, cost: 1100, cps: 32, count: 0 },
      { id: 'factory', name: 'Cookie Factory', baseCost: 12000, cost: 12000, cps: 260, count: 0 },
      { id: 'portal', name: 'Cookie Portal', baseCost: 130000, cost: 130000, cps: 1800, count: 0 }
    ];

    // Load saved counts
    items.forEach(it => {
      const saved = localStorage.getItem('cookie_item_' + it.id);
      if (saved) {
        it.count = parseInt(saved, 10);
        it.cost = Math.floor(it.baseCost * Math.pow(1.15, it.count));
      }
    });

    const cookieEl = document.getElementById('cookie');
    const cookieArea = document.getElementById('cookie-area');
    const cookiesCountEl = document.getElementById('cookies-count');
    const cpsCountEl = document.getElementById('cps-count');
    const shopList = document.getElementById('shop-list');

    function getCps() {
      return items.reduce((acc, it) => acc + (it.cps * it.count), 0);
    }

    function updateDisplay() {
      cookiesCountEl.textContent = Math.floor(cookies).toLocaleString();
      cpsCountEl.textContent = getCps().toFixed(1);

      // Render shop
      shopList.innerHTML = '';
      items.forEach((it, idx) => {
        const canBuy = cookies >= it.cost;
        const row = document.createElement('div');
        row.className = 'shop-item' + (canBuy ? '' : ' disabled');
        row.onclick = () => buyItem(idx);
        row.innerHTML = `
          <div class="item-info">
            <span class="item-name">${it.name}</span>
            <span class="item-desc">+${it.cps} cps</span>
          </div>
          <div>
            <div class="item-cost">${it.cost.toLocaleString()} 🍪</div>
            <div class="item-count">Owned: ${it.count}</div>
          </div>
        `;
        shopList.appendChild(row);
      });
    }

    function clickCookie(e) {
      cookies += 1;
      updateDisplay();

      // Float text
      const rect = cookieArea.getBoundingClientRect();
      const txt = document.createElement('div');
      txt.className = 'float-text';
      txt.textContent = '+1';
      txt.style.left = (e.clientX - rect.left - 10) + 'px';
      txt.style.top = (e.clientY - rect.top - 20) + 'px';
      cookieArea.appendChild(txt);
      setTimeout(() => txt.remove(), 700);
    }

    function buyItem(idx) {
      const it = items[idx];
      if (cookies >= it.cost) {
        cookies -= it.cost;
        it.count++;
        it.cost = Math.floor(it.baseCost * Math.pow(1.15, it.count));
        localStorage.setItem('cookie_item_' + it.id, it.count);
        localStorage.setItem('cookie_total', cookies);
        updateDisplay();
      }
    }

    // Passive loop
    setInterval(() => {
      const cps = getCps();
      if (cps > 0) {
        cookies += cps / 10;
        localStorage.setItem('cookie_total', cookies);
        updateDisplay();
      }
    }, 100);

    updateDisplay();
  </script>
</body>
</html>
